name: Buoy 1 Stablecoin Radar

# Время запуска задаётся внешним триггером cron-job.org на 06:50 UTC
# (решение Viktor 26.09.2026, по прецеденту skew 29.08.2026).
# Собственное расписание GitHub снято: cron '15 6 * * *' фактически
# срабатывал в 10:54–12:43 UTC, и утренний Daily Check (07:46 UTC)
# каждый день видел вчерашнюю точку как STALE.
on:
  workflow_dispatch: {}     # запуск: cron-job.org (06:50 UTC) или вручную из Actions

jobs:
  run-buoy-1:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install requests
      - run: python3 buoy_1_stablecoin_radar.py
      - name: Commit updated history/output
        run: |
          git config user.name "actions-user"
          git config user.email "actions@github.com"
          git add buoy_1_output.json buoy_1_history.json
          git diff --staged --quiet || git commit -m "Update Buoy 1 stablecoin radar"
          git pull --rebase origin main
          git push
