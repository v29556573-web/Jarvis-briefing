name: Buoy 1 Stablecoin Radar

on:
  schedule:
    - cron: '15 6 * * *'   # ежедневно, смести от других cron'ов (skew/CME-OKX), чтобы не было queue congestion
  workflow_dispatch: {}     # ручной запуск из вкладки Actions

jobs:
  run-buoy-1:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install requests
      - run: python3 buoy_1_stablecoin_radar.py
      - name: Commit updated history/output
        run: |
          git config user.name "actions-user"
          git config user.email "actions@github.com"
          git add buoy_1_output.json buoy_1_history.json
          git diff --staged --quiet || git commit -m "Update Buoy 1 stablecoin radar"
          git push
