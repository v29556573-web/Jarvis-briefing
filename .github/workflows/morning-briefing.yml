name: JARVIS Morning Briefing

# Запуск только извне: cron-job.org → workflow_dispatch
# (Morning Briefing 08:13 MSK, Pre-Market 15:46 MSK).
# Блок schedule: удалён 04.10.2026: расписание GitHub дублировало cron-job.org
# (4 запуска в сутки вместо 2) и плавало по времени.
on:
  workflow_dispatch: {}

jobs:
  send-briefing:
    # Закреплено 04.10.2026: с 19.10 ubuntu-latest переходит на Ubuntu 26
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install requests

      - name: Run briefing script
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python morning_briefing.py
