# Сохранить этот файл в репозитории по пути: .github/workflows/morning-briefing.yml # (папку .github/workflows нужно создать вручную, GitHub сам её не создаёт) name: JARVIS Morning Briefing on: schedule: # 04:00 UTC = 07:00 по Москве (UTC+3). Поменяй час, если нужно другое время. # Формат cron: минута час день месяц день-недели - cron: "0 4 * * *" workflow_dispatch: {} # позволяет запустить вручную кнопкой "Run workflow" в GitHub для теста jobs: send-briefing: runs-on: ubuntu-latest steps: - name: Checkout repo uses: actions/checkout@v4 - name: Set up Python uses: actions/setup-python@v5 with: python-version: "3.12" - name: Install dependencies run: pip install requests - name: Run briefing script env: TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }} TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }} run: python morning_briefing.py
