name: Test Skew Block

# ВНИМАНИЕ: тестовый workflow. Запись в репозиторий ЗАПРЕЩЕНА намеренно.
# 23.08.2026 этот workflow закоммитил точку в боевой skew_history.json
# (19:53 UTC, skew -0.33) — она попала в baseline §10.3.
# permissions: read-all и отсутствие git push — это предохранитель,
# не упущение. Не возвращать contents: write.

permissions:
  contents: read

on:
  workflow_dispatch: {}

jobs:
  test-run:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install requests

      - name: Run skew block (test)
        run: python skew_block.py

      - name: Verify no production file was modified
        run: |
          git diff --quiet -- skew_history.json skew_intraday.json skew_block_output.json \
            || echo "::warning::skew_block.py изменил боевые файлы локально; в репозиторий они не уйдут (нет прав на запись)"

      - name: Upload test output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: skew-test-output
          path: |
            skew_history.json
            skew_intraday.json
            skew_block_output.json
          retention-days: 14
          if-no-files-found: warn
