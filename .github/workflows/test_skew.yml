name: Test Skew Block

permissions:
  contents: write

on:
  workflow_dispatch: {}

jobs:
  test-run:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install requests

      - name: Run skew block (test)
        run: python skew_block.py

      - name: Commit skew history
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add skew_history.json skew_intraday.json
          git diff --staged --quiet || git commit -m "Update skew history (test)"
          git push
